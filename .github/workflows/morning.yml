name: Morning Wisdom

on:
  schedule:
    # 20:00 UTC ≈ 06:00 AEST (07:00 AEDT) — adjust if you prefer
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD); leave blank for today (TZ_OFFSET)"
        required: false
        type: string

jobs:
  send-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir

      - name: Send morning email
        env:
          # Use your existing secrets (no renaming required)
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_LIST:   ${{ secrets.EMAIL_TO }}           # maps existing single/multi to the new script
          SMTP_HOST:       ${{ secrets.SMTP_SERVER }}        # map to existing SMTP_SERVER
          SMTP_PORT:       ${{ secrets.SMTP_PORT || '587' }} # default to 587 if empty
          SMTP_USERNAME:   ${{ secrets.EMAIL_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          # Content file locations (use defaults if you keep files at repo root)
          STOIC_GLOB:      ${{ secrets.STOIC_GLOB }}
          DAD_GLOB:        ${{ secrets.DAD_GLOB }}
          WEEKLY_FILE:     ${{ secrets.WEEKLY_FILE }}
          JOURNAL_FILE:    ${{ secrets.JOURNAL_FILE }}
          # Timezone offset for computing "today" (optional; default 10 if unset)
          TZ_OFFSET:       ${{ secrets.TZ_OFFSET || '10' }}
          DATE:            ${{ inputs.date }}
        run: |
          if [[ -n "${DATE}" ]]; then
            python app_mailer.py --mode morning --date "${DATE}"
          else
            python app_mailer.py --mode morning
          fi