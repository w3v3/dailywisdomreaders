name: Morning Wisdom

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD); leave blank for today"
        required: false
        type: string

jobs:
  send-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Send morning email
        env:
          # From / To (set both variants)
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_LIST:     ${{ secrets.EMAIL_TO_LIST || secrets.EMAIL_TO }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO || secrets.EMAIL_TO_LIST }}

          # SMTP host/port/user/pass (set both variants)
          SMTP_HOST:         ${{ secrets.SMTP_HOST || secrets.SMTP_SERVER }}
          SMTP_SERVER:       ${{ secrets.SMTP_SERVER || secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME:     ${{ secrets.SMTP_USERNAME || secrets.EMAIL_USERNAME }}
          EMAIL_USERNAME:    ${{ secrets.EMAIL_USERNAME || secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_PASSWORD }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD || secrets.SMTP_PASSWORD }}

          # Content locations (optional; leave blank to use defaults)
          STOIC_GLOB:        ${{ secrets.STOIC_GLOB }}
          DAD_GLOB:          ${{ secrets.DAD_GLOB }}
          WEEKLY_FILE:       ${{ secrets.WEEKLY_FILE }}
          JOURNAL_FILE:      ${{ secrets.JOURNAL_FILE }}

          # Timezone offset (optional)
          TZ_OFFSET:         ${{ secrets.TZ_OFFSET || '10' }}

          DATE:              ${{ inputs.date }}
        run: |
          if [[ -n "${DATE}" ]]; then
            python app_mailer.py --mode morning --date "${DATE}"
          else
            python app_mailer.py --mode morning
          fi
