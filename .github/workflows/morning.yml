name: Morning Wisdom (06:10 Sydney)

on:
  schedule:
    # 19:10 UTC ~= 06:10 AEDT (UTC+11)
    - cron: "10 19 * * *"
    # 20:10 UTC ~= 06:10 AEST (UTC+10)
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD); leave blank for 'today' (based on TZ_OFFSET)"
        required: false
        type: string

concurrency:
  group: morning-mailer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir

      - name: Skip unless it's 06:10 local
        env:
          TZ_OFFSET: ${{ secrets.TZ_OFFSET || '10' }}
        run: |
          set -e
          offset="${TZ_OFFSET}"
          now_utc="$(date -u +%s)"
          secs=$(( now_utc + offset*3600 ))
          hh=$(date -u -d "@$secs" +%H)
          mm=$(date -u -d "@$secs" +%M)
          echo "Computed local time (offset=${offset}) -> ${hh}:${mm}"
          if [ "${hh}:${mm}" != "06:10" ]; then
            echo "Not 06:10 local; skipping."
            exit 0
          fi

      - name: Send morning email (06:10 local confirmed)
        env:
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_LIST:     ${{ secrets.EMAIL_TO_LIST || secrets.EMAIL_TO }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO || secrets.EMAIL_TO_LIST }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST || secrets.SMTP_SERVER }}
          SMTP_SERVER:       ${{ secrets.SMTP_SERVER || secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME:     ${{ secrets.SMTP_USERNAME || secrets.EMAIL_USERNAME }}
          EMAIL_USERNAME:    ${{ secrets.EMAIL_USERNAME || secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_PASSWORD }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD || secrets.SMTP_PASSWORD }}
          TZ_OFFSET:         ${{ secrets.TZ_OFFSET || '10' }}
          DATE:              ${{ inputs.date }}
        run: |
          if [[ -n "${DATE}" ]]; then
            python app_mailer.py --mode morning --date "${DATE}"
          else
            python app_mailer.py --mode morning
          fi