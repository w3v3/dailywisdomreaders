name: Morning Wisdom

on:
  schedule:
    # 20:00 UTC ≈ 06:00 AEST (07:00 AEDT) — adjust as desired
    - cron: "0 20 * * *"

jobs:
  send-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir

      - name: Send morning email
        env:
          STOIC_GLOB:      ${{ secrets.STOIC_GLOB }}       # e.g. "daily-stoic-*.json"
          DAD_GLOB:        ${{ secrets.DAD_GLOB }}         # e.g. "daily-dad-*.json"
          WEEKLY_FILE:     ${{ secrets.WEEKLY_FILE }}      # e.g. "weekly-reflections.json"
          JOURNAL_FILE:    ${{ secrets.JOURNAL_FILE }}     # e.g. "daily-journal.json"
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_LIST:   ${{ secrets.EMAIL_TO_LIST }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          TZ_OFFSET:       ${{ secrets.TZ_OFFSET }}        # 10 AEST / 11 AEDT
        run: python app_mailer.py --mode morning