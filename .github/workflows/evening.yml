name: Evening Digest

on:
  schedule:
    # 08:00 UTC ≈ 18:00 AEST (19:00 AEDT)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD); leave blank for today (TZ_OFFSET)"
        required: false
        type: string

jobs:
  send-evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir

      - name: Send evening digest
        env:
          STOIC_GLOB:      ${{ secrets.STOIC_GLOB }}
          DAD_GLOB:        ${{ secrets.DAD_GLOB }}
          WEEKLY_FILE:     ${{ secrets.WEEKLY_FILE }}
          JOURNAL_FILE:    ${{ secrets.JOURNAL_FILE }}
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_LIST:   ${{ secrets.EMAIL_TO_LIST }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          TZ_OFFSET:       ${{ secrets.TZ_OFFSET }}
          DATE:            ${{ inputs.date }}
        run: |
          if [[ -n "${DATE}" ]]; then
            python app_mailer.py --mode evening --date "${DATE}"
          else
            python app_mailer.py --mode evening
          fi